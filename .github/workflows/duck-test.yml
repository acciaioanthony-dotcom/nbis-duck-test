name: NBIS DUCK Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 21-23,0-6 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Connexion Google
        uses: google-github-actions/auth@v3
        with:
          project_id: project-e8cb129e-ffe0-4624-98b
          workload_identity_provider: projects/806064245872/locations/global/workloadIdentityPools/nbis-github/providers/github-nbis

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Worker DUCK
        run: |
          B=gs://nbis-github-research-806064245872

          if ! gcloud storage ls "$B/jobs/current/PENDING" >/dev/null 2>&1; then
            echo "NO_JOB"
            exit 0
          fi

          gcloud storage cp "$B/jobs/current/job.py" /tmp/job.py
          gcloud storage cp "$B/jobs/current/input.parquet" /tmp/input.parquet

          python -m pip install --quiet duckdb
          python /tmp/job.py /tmp/input.parquet /tmp/result.json

          gcloud storage cp /tmp/result.json "$B/jobs/current/result.json"
          gcloud storage rm "$B/jobs/current/PENDING"

          echo "DONE" > /tmp/DONE
          gcloud storage cp /tmp/DONE "$B/jobs/current/DONE"

          cat /tmp/result.json
